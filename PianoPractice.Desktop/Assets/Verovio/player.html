        bottomGap: bounds ? stageRect.bottom - bounds.bottom : null,
        gapDifference: bounds
          ? Math.abs((bounds.top - stageRect.top) - (stageRect.bottom - bounds.bottom))
          : null,
        stageWidth: stageRect.width,
        stageHeight: stageRect.height,
        backwardSamples
      };
      window.__cadenzaLayoutValidation = lastLayoutValidation;
      post("layoutValidation", lastLayoutValidation);
      return lastLayoutValidation;
    }

    function systemForEvent(event) {
      if (event?.cadenzaEnd) return [...notation.querySelectorAll("g.system")].at(-1) || null;
      return positionIds(event).map(elementForVerovioId).find(Boolean)?.closest("g.system") || null;
    }

    function elementForVerovioId(id) {
      if (!id) return null;
      const strId = String(id);
      let found = document.getElementById(strId) ||
        notation.querySelector(`[data-id="${CSS.escape(strId)}"]`);
      if (found) return found;
      if (strId.includes("rest")) {
        return notation.querySelector("g.rest") || notation.querySelector(".rest");
      }
      if (strId.includes("measure")) {
        return notation.querySelector("g.measure") || notation.querySelector(".measure");
      }
      return null;
    }

    function systemEndBarLineX(system) {
      if (!system) return null;
      const barlines = [...system.querySelectorAll("g.barLine, .barLine, path[class*='barLine']")];
      if (barlines.length > 0) {
        const lastBar = barlines[barlines.length - 1];
        const rect = lastBar.getBoundingClientRect();
        const stageRect = stage.getBoundingClientRect();
        return rect.left + rect.width / 2 - stageRect.left;
      }
      const systemRect = system.getBoundingClientRect();
      const stageRect = stage.getBoundingClientRect();
      return systemRect.right - 12 - stageRect.left;
    }

    function updateCursor(ms, immediate) {
      if (!toolkit || !timemap.length) return;
      const perfBeat = ms * bpm / 60000;
      const sourceBeat = performanceToSourceBeat(perfBeat);
      const sourceMs = sourceBeat * 60000 / bpm;
      const atTime = toolkit.getElementsAtTime(Math.max(0, Math.round(sourceMs)));
      const previous = eventWithPositionAtOrBefore(sourceMs);
      const next = eventWithPositionAfter(sourceMs);
      const desiredPage = pageForEvent(previous || next);
      if (desiredPage !== currentPage) {
        return;
      }

      const continuous = readingMode === "Continuous";
      const previousSystem = systemForEvent(previous);
      const nextSystem = systemForEvent(next);
      const nextCenter = eventViewportCenter(next);

      // If next is in a different system, on a different page, or has no rendered DOM element on this page:
      const crossesBoundary = Boolean(!nextSystem || nextCenter == null || (previousSystem && previousSystem !== nextSystem));

      let x1 = eventViewportCenter(previous);
      let x2 = (crossesBoundary && previousSystem) ? systemEndBarLineX(previousSystem) : nextCenter;
      if (x1 == null && x2 == null) return;
      if (x1 == null) x1 = x2;
      if (x2 == null) x2 = x1;
      const span = Math.max(1, (next?.tstamp ?? sourceMs) - (previous?.tstamp ?? sourceMs));
      const progress = Math.max(0, Math.min(1, (sourceMs - (previous?.tstamp ?? sourceMs)) / span));
      const x = x1 + (x2 - x1) * progress;
      let visibleX = x;
      if (continuous) {
        const stageRect = stage.getBoundingClientRect();
        const anchorX = Math.max(180, stageRect.width * .32);
        const previousOffsetX = continuousOffsetX;
        let nextOffsetX = Math.min(24, previousOffsetX + anchorX - x);
        if (timelineRunning) nextOffsetX = Math.min(continuousOffsetX, nextOffsetX);
        continuousOffsetX = nextOffsetX;
        applyContinuousTransform();
        visibleX = x + continuousOffsetX - previousOffsetX;
        const scoreX = (x - previousOffsetX) / Math.max(.01, userZoom);
        const highlighted = (atTime?.notes || [])
          .map(elementForVerovioId)
          .filter(Boolean)
          .map(element => {
            const anchor = element.querySelector(":scope > g.notehead") || element.querySelector("g.notehead") || element;
            const rect = anchor.getBoundingClientRect();
            return rect.left + rect.width / 2 - stageRect.left;
          });
        const highlightedX = highlighted.length
          ? highlighted.reduce((sum, value) => sum + value, 0) / highlighted.length
          : null;
        recordRuntimeTelemetry(ms * bpm / 60000, previous, next, scoreX, visibleX, highlightedX);
      }
      playhead.style.left = `${visibleX}px`;
      playhead.style.opacity = "1";
      const system = previousSystem || nextSystem;
      if (system) {
        const systemRect = system.getBoundingClientRect();
        const stageRect = stage.getBoundingClientRect();
        const top = Math.max(6, systemRect.top - stageRect.top - 8);
        const bottom = Math.min(stageRect.height - 6, systemRect.bottom - stageRect.top + 8);
        playhead.style.top = `${top}px`;
        playhead.style.height = `${Math.max(24, bottom - top)}px`;
        const systems = [...notation.querySelectorAll("g.system")];
        const systemNumber = Math.max(1, systems.indexOf(system) + 1);
        const positionKey = `${currentPage}:${systemNumber}:${systems.length}`;
        if (positionKey !== lastPositionKey) {
          lastPositionKey = positionKey;
          post("position", { page: currentPage, pages: pageCount, system: systemNumber, systems: systems.length });
        }
      }

      document.querySelectorAll(".playing").forEach(node => node.classList.remove("playing"));
      for (const id of atTime?.notes || []) {
        const el = elementForVerovioId(id);
        if (el) {
          el.classList.add("playing");
          el.querySelectorAll(".syl, text, tspan").forEach(c => c.classList.add("playing"));
        }
      }
      for (const id of atTime?.elements || []) {
        const el = elementForVerovioId(id);
        if (el && (el.matches(".syl") || el.closest(".syl"))) {
          el.classList.add("playing");
        }
      }
    }

    new ResizeObserver(() => {
      if (!toolkit || !notation.querySelector("svg")) return;
      if (readingMode === "Continuous") sizeContinuousSvg();
      alignNotationVertically();
      if (timemap.length) {
        renderLatestCursor();
        validateRendererLayout();
      }
    }).observe(stage);

    function findTiedContinuationElements(node) {
      if (!node || !notation) return [];
      const note = node.closest?.("g.note") || node;
      const noteId = note.id || note.getAttribute("data-id");
      if (!noteId) return [];

      const result = [];
      const visited = new Set([noteId]);
      const queue = [noteId];

      while (queue.length > 0) {
        const currentId = queue.shift();
        const tiesAndSlurs = notation.querySelectorAll("g.tie, g.slur, .tie, .slur");
        for (const item of tiesAndSlurs) {
          const itemId = item.id || item.getAttribute("data-id");
          let startId = item.getAttribute("data-startid") || item.getAttribute("startid") ||
            item.querySelector("[data-startid]")?.getAttribute("data-startid") ||
            item.querySelector("[startid]")?.getAttribute("startid") || "";
          let endId = item.getAttribute("data-endid") || item.getAttribute("endid") ||
            item.querySelector("[data-endid]")?.getAttribute("data-endid") ||
            item.querySelector("[endid]")?.getAttribute("endid") || "";

          if ((!startId || !endId) && toolkit?.getElementAttr && itemId) {
            try {
              const attrs = toolkit.getElementAttr(itemId);
              if (attrs) {
                startId = startId || attrs.startid || attrs["data-startid"] || attrs["@startid"] || "";
                endId = endId || attrs.endid || attrs["data-endid"] || attrs["@endid"] || "";
              }
            } catch {
              // ignore
            }
          }

          startId = String(startId || "").replace(/^#/, "");
          endId = String(endId || "").replace(/^#/, "");

          const matchStart = startId && (startId === currentId || currentId.endsWith(startId) || startId.endsWith(currentId));
          if (matchStart && endId && !visited.has(endId)) {
            visited.add(endId);
            queue.push(endId);
            const targetNode = elementForVerovioId(endId);
            if (targetNode) {
              const targetNote = targetNode.closest?.("g.note") || targetNode;
              result.push(targetNote);
            }
          }
        }
      }
      return result;
    }

    function showFeedback(kind, beat, midiNote = null, dispatchId = 0, runGeneration = 0, eventId = 0, occurrenceIndex = 0, staffNumber = 0) {
      const numericRunGeneration = Number(runGeneration || 0);
      if (!lessonRunning || (numericRunGeneration > 0 && numericRunGeneration !== lessonGeneration)) return false;
      const numericDispatchId = Number(dispatchId || 0);
      feedbackTelemetry.received++;
      if (kind === "wrong" || kind === "extra") feedbackTelemetry.receivedWrong++;
      if (kind === "correct") feedbackTelemetry.receivedCorrect++;
      if (numericDispatchId > 0) {
        if (feedbackTelemetry.lastDispatchId > 0 && numericDispatchId > feedbackTelemetry.lastDispatchId + 1)
          feedbackTelemetry.dispatchGaps += numericDispatchId - feedbackTelemetry.lastDispatchId - 1;
        feedbackTelemetry.lastDispatchId = Math.max(feedbackTelemetry.lastDispatchId, numericDispatchId);
      }
      const ms = Number(beat || 0) * 60000 / bpm;
      if (lessonMode === "WaitForYou") setCursorBeat(beat);
      const event = eventAtBeat(beat);
      const targetElements = elementsForEvent(event, midiNote, staffNumber);

      if (lessonMode === "WaitForYou" && (kind === "wrong" || kind === "extra")) {
        activeWrongFeedback = {
          beat: Number(beat || 0),
          midiNote: Number(midiNote),
          dispatchId: numericDispatchId,
          eventId: Number(eventId || 0),
          occurrenceIndex: Number(occurrenceIndex || 0),
          kind,
          staffNumber: Number(staffNumber || 0),
          expiresAt: performance.now() + 900
        };
        showPracticeWrongNote(event, midiNote, numericDispatchId, false, staffNumber);
        return true;
      }
      if (lessonMode === "WaitForYou" && kind === "correct") {
        clearPracticeWrongNote();
        const acceptedTargets = targetElements.length ? targetElements : [null];
        const expandedTargets = [];
        for (const node of acceptedTargets) {
          if (node) {
            expandedTargets.push(node);
            for (const continuation of findTiedContinuationElements(node)) {
              if (!expandedTargets.includes(continuation)) expandedTargets.push(continuation);
            }
          }
        }
        const targetsToPaint = expandedTargets.length ? expandedTargets : acceptedTargets;
        const renderedKeys = [];
        const paintedTargets = targetsToPaint.map((node, targetIndex) => {
          const noteIdentity = node?.id || node?.getAttribute("data-id") ||
            `${Number(beat || 0).toFixed(6)}:${Number(midiNote)}:${Number(staffNumber || 0)}:${targetIndex}`;
          const persistentKey = `${lessonGeneration}:${Number(occurrenceIndex || 0)}:${noteIdentity}`;
          const item = {
            beat: Number(beat || 0),
            midiNote: midiNote == null ? null : Number(midiNote),
            eventId: Number(eventId || 0),
            occurrenceIndex: Number(occurrenceIndex || 0),
            staffNumber: Number(staffNumber || 0),
            noteIdentity
          };
          if (node) {
            node.classList.add("feedback-correct");
            paintNotehead(node, "#19f47b");
          }
          persistentCorrectFeedback.set(persistentKey, item);
          const rendered = renderPracticeCorrectNote(persistentKey, item);
          if (rendered) renderedKeys.push(persistentKey);
          const overlay = practiceWrongNote.querySelector(
            `:scope > g.correct-feedback[data-feedback-key="${CSS.escape(persistentKey)}"]`);
          const head = overlay?.querySelector(".correct-notehead");
          const rect = head?.getBoundingClientRect();
          const style = head ? getComputedStyle(head) : null;
          const stageRect = stage.getBoundingClientRect();
          const describePart = selector => {
            const part = node?.querySelector(selector);
            const partPaint = part?.querySelector("use, path, line, polygon, polyline") || part;
            const partStyle = partPaint ? getComputedStyle(partPaint) : null;
            return part ? {
              fill: partStyle?.fill || null,
              stroke: partStyle?.stroke || null
            } : null;
          };
          return {
            id: noteIdentity,
            overlayKey: persistentKey,
            overlayFound: Boolean(overlay),
            duplicateOverlayCount: practiceWrongNote.querySelectorAll(
              `:scope > g.correct-feedback[data-feedback-key="${CSS.escape(persistentKey)}"]`).length,
            headFound: Boolean(head),
            fill: style?.fill || null,
            stroke: style?.stroke || null,
            opacity: style?.opacity || null,
            x: rect ? rect.left + rect.width / 2 - stageRect.left : null,
            y: rect ? rect.top + rect.height / 2 - stageRect.top : null,
            width: rect?.width ?? null,
            height: rect?.height ?? null,
            nonHeadPaint: {
              stem: describePart(".stem"),
              flag: describePart(".flag"),
              accidental: describePart(".accid"),
              beam: describePart(".beam"),
              ledger: describePart(".ledgerLines")
            },
            visibleInStage: Boolean(rect &&
              rect.right >= stageRect.left && rect.left <= stageRect.right &&
              rect.bottom >= stageRect.top && rect.top <= stageRect.bottom)
          };
        });
        feedbackTelemetry.renderedCorrect += renderedKeys.length;
        post("feedbackAck", {
          runGeneration: lessonGeneration,
          eventId: Number(eventId || 0),
          dispatchId: numericDispatchId,
          occurrenceIndex: Number(occurrenceIndex || 0),
          kind,
          staffNumber: Number(staffNumber || 0),
          rendered: renderedKeys.length > 0,
          renderedCount: renderedKeys.length,
          persistentCorrectCount: persistentCorrectFeedback.size,
          paintedTargets
        });
        if (lessonRunning && lessonMode === "TimedPlay" && onlyShowFeedbackOnEnd) {
          return true;
        }
        return true;
      }

      if (lessonRunning && lessonMode === "TimedPlay" && onlyShowFeedbackOnEnd) {
        return;
      }

      if (kind === "release") {
        targetElements.forEach(node => node.classList.remove("feedback-hold", "feedback-early"));
        return;
      }

      if (kind === "hold") {
        targetElements.forEach(node => node.classList.add("feedback-hold"));
        return;
      }

      document.querySelectorAll("g.note.feedback-wrong, g.note.feedback-early, g.note.feedback-missed")
        .forEach(node => {
          node.classList.remove("feedback-wrong", "feedback-early", "feedback-missed");
          paintNotehead(node);
        });
      if (kind !== "correct") {
        document.querySelectorAll("g.note.feedback-early, g.note.feedback-missed")
          .forEach(node => node.classList.remove("feedback-early", "feedback-missed"));
      }

      const noteClass = kind === "correct" ? "feedback-correct" :
        kind === "wrong" || kind === "extra" ? "feedback-wrong" :
        kind === "hold" ? "feedback-hold" :
        kind === "early" ? "feedback-early" :
        kind === "missed" ? "feedback-missed" : "";
      if (noteClass) {
        const visualTargets = kind === "wrong" || kind === "extra"
          ? elementsForEvent(event, null).filter(node => !node.classList.contains("feedback-correct"))
          : targetElements;
        const noteColor = kind === "correct" ? "#19f47b" :
          kind === "wrong" || kind === "extra" || kind === "missed" ? "#ff6577" :
          kind === "early" ? "#ffb54d" : "#f6f2e9";
        const expandedTargets = [];
        visualTargets.forEach(node => {
          if (node) {
            expandedTargets.push(node);
            if (kind === "correct") {
              for (const continuation of findTiedContinuationElements(node)) {
                if (!expandedTargets.includes(continuation)) expandedTargets.push(continuation);
              }
            }
          }
        });
        expandedTargets.forEach(node => {
          node.classList.add(noteClass);
          if (kind !== "hold") paintNotehead(node, noteColor);
        });
      }

      if (lessonMode === "TimedPlay" && ["correct", "wrong", "extra", "missed", "early"].includes(kind)) {
        auditTrail.push({
          kind,
          beat: Number(beat || 0),
          midiNote: midiNote == null ? null : Number(midiNote),
          label: kind === "correct" ? "Correct note" :
            kind === "missed" ? "Missed expected note" :
            kind === "early" ? "Released early" : "Extra or wrong note"
        });
        if (auditVisible) rebuildAudit();
      }

      const labels = { correct: "✓", wrong: "×", extra: "×", missed: "MISS", hold: "HOLD", early: "EARLY" };
      feedback.textContent = labels[kind] || "•";
      feedback.className = "";
      feedback.style.opacity = "0";
      if (noteClass && noteClass !== "feedback-correct") {
        clearTimeout(feedbackTimer);
        feedbackTimer = setTimeout(() => {
          document.querySelectorAll(`g.note.${noteClass}`).forEach(node => {
            node.classList.remove(noteClass);
            paintNotehead(node);
          });
          reapplyLessonFeedback();
        }, kind === "wrong" || kind === "extra" ? 420 : 700);
      }
    }

    function clearPartialFeedback(occurrenceIndex) {
      const idx = Number(occurrenceIndex || 0);
      const keysToDelete = [];
      for (const [key, item] of persistentCorrectFeedback) {
        if (Number(item.occurrenceIndex || 0) === idx) {
          keysToDelete.push(key);
        }
      }
      for (const key of keysToDelete) {
        persistentCorrectFeedback.delete(key);
      }
      document.querySelectorAll("g.note.feedback-correct").forEach(node => {
        node.classList.remove("feedback-correct");
        paintNotehead(node);
      });
      reapplyLessonFeedback();
    }

    function showCountdownStep(text) {
      const overlay = document.getElementById("countdownOverlay");
      const number = document.getElementById("countdownNumber");
      if (!overlay || !number) return;
      overlay.classList.add("active");
      number.textContent = String(text || "");
      number.classList.remove("pulse");
      void number.offsetWidth;
      number.classList.add("pulse");
    }

    function hideCountdown() {
      const overlay = document.getElementById("countdownOverlay");
      const number = document.getElementById("countdownNumber");
      if (overlay) overlay.classList.remove("active");
      if (number) number.classList.remove("pulse");
    }

    function showResultsModal(headline, reward, accuracy, timing, hold, pedal, correctCount, missedCount, extraCount, repeatText, progress, voicing, articulation, chordSync) {
      const overlay = document.getElementById("resultsModalOverlay");
      if (!overlay) return;
      document.getElementById("resultsHeadline").textContent = headline || "Run Complete";
      document.getElementById("resultsReward").textContent = reward || "";
      document.getElementById("resAccuracy").textContent = accuracy || "0%";
      document.getElementById("resTiming").textContent = timing || "n/a";
      document.getElementById("resHold").textContent = hold || "—";
      document.getElementById("resVoicing").textContent = voicing || "100%";
      document.getElementById("resArticulation").textContent = articulation || "100%";
      document.getElementById("resChordSync").textContent = chordSync || "100%";

      const pedalBox = document.getElementById("resPedalBox");
      if (pedal !== null && pedal !== undefined) {
        document.getElementById("resPedal").textContent = pedal;
        if (pedalBox) pedalBox.style.display = "block";
      } else {
        if (pedalBox) pedalBox.style.display = "none";
      }

      document.getElementById("resCorrectCount").textContent = String(correctCount || 0);
      document.getElementById("resMissedCount").textContent = String(missedCount || 0);
      document.getElementById("resExtraCount").textContent = String(extraCount || 0);

      updateResultsAutoRepeat(repeatText, progress);
      overlay.classList.add("active");
    }

    function updateResultsAutoRepeat(text, progress) {
      const txt = document.getElementById("resultsRepeatText");
      const fill = document.getElementById("resultsProgressFill");
      if (txt) txt.textContent = text || "";
      const pct = Math.min(100, Math.max(0, Number(progress || 0) * 100));
      if (fill) fill.style.width = `${pct}%`;
    }

    function hideResultsModal() {
      const overlay = document.getElementById("resultsModalOverlay");
      if (overlay) overlay.classList.remove("active");
    }

    window.CadenzaNotation = { loadScore, setPerformanceTimeline, setReadingMode, setHintMode, setHandMode, startPlayback, stopPlayback, beginTimeline, endTimeline, setCursorBeat, setZoom, setTempo, changePage, resetAudit, beginLesson, finishLesson, showFeedback, clearPartialFeedback, showCountdownStep, hideCountdown, showResultsModal, updateResultsAutoRepeat, hideResultsModal, getState, elementsAtBeat, validateRendererLayout, validateFeedbackGeometry };

    document.addEventListener("DOMContentLoaded", () => {
      verovio.module.onRuntimeInitialized = () => {
        toolkit = new verovio.toolkit();
        post("ready", { version: toolkit.getVersion() });
      };
    });
  </script>
</body>
