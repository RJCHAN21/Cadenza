        receivedCorrect: 0,
        renderedWrong: 0,
        renderedCorrect: 0,
        failedWrong: 0,
        lastDispatchId: 0,
        dispatchGaps: 0
      };
      resetAudit();
      clearPracticeWrongNote();
      clearPracticeCorrectNotes();
      clearTemporaryLiveNoteFeedback();
      feedback.className = "";
      feedback.style.opacity = "0";
      document.querySelectorAll("g.note.feedback-correct, g.note.feedback-wrong, g.note.feedback-hold, g.note.feedback-early, g.note.feedback-missed, g.note.audit-correct, g.note.audit-missed, g.note.audit-early")
        .forEach(node => {
          node.classList.remove("feedback-correct", "feedback-wrong", "feedback-hold", "feedback-early", "feedback-missed", "audit-correct", "audit-missed", "audit-early");
          node.removeAttribute("data-cadenza-feedback");
          paintNotehead(node);
        });
      const firstBeat = Number(startBeat || 0);
      const firstPage = pageForEvent(eventAtBeat(firstBeat));
      if (firstPage !== currentPage) renderPage(firstPage, false);
      lastPositionKey = "";
      beginTimeline(firstBeat);
    }

    function finishLesson(completed, runGeneration = 0) {
      if (Number(runGeneration || lessonGeneration) !== lessonGeneration) return;
      endTimeline();
      if (Boolean(completed)) playhead.style.opacity = "1";
      lessonRunning = false;
      feedback.className = "";
      feedback.style.opacity = "0";
      clearTimeout(feedbackTimer);
      
      // Reveal/preserve all annotated green and red score markers for post-run review
      reapplyLessonFeedback();

      auditVisible = Boolean(completed) && lessonMode === "TimedPlay";
      if (auditVisible) rebuildAudit();
      else resetAudit();
      post("feedbackTelemetry", { mode: lessonMode, completed: Boolean(completed), ...feedbackTelemetry });
    }

    function getState() {
      return {
        currentPage,
        pageCount,
        pendingPage,
        readingMode,
        hintMode,
        handMode,
        playing,
        lessonRunning,
        lessonMode,
        auditVisible,
        auditCount: auditTrail.length,
        renderedAuditCount: audit.children.length,
        renderedPracticeCorrectCount: practiceWrongNote.querySelectorAll(":scope > g.correct-feedback").length,
        renderedPracticeWrongCount: practiceWrongNote.querySelectorAll(":scope > g.wrong-feedback").length,
        feedbackKind: feedback.className,
        practiceWrongMidi: practiceWrongNote.getAttribute("data-midi"),
        playheadLeft: parseFloat(playhead.style.left || "0"),
        playheadTop: parseFloat(playhead.style.top || "0"),
        playheadHeight: parseFloat(playhead.style.height || "0"),
        cursorBeat: latestRequestedBeat,
        continuousOffsetX,
        continuousOffsetY,
        finalQstamp: timemap.at(-1)?.qstamp ?? null,
        layoutValidation: lastLayoutValidation,
        runtimeTelemetry,
        feedbackTelemetry,
        feedbackGeometry: validateFeedbackGeometry()
      };
    }

    function elementsAtBeat(beat) {
      const sourceBeat = performanceToSourceBeat(beat);
      const event = eventAtBeat(sourceBeat);
      return {
        toolkit: toolkit?.getElementsAtTime(Math.max(0, Math.round(Number(sourceBeat || 0) * 60000 / bpm))) || null,
        indexedPage: pageForEvent(event),
        qstamp: event?.qstamp ?? null
      };
    }

    function eventAtBeat(beat) {
      const target = performanceToSourceBeat(beat);
      return timemap.reduce((best, event) =>
        (event.on?.length || event.restsOn?.length || event.measureOn) &&
        Math.abs((event.qstamp ?? 0) - target) < Math.abs((best?.qstamp ?? 1e9) - target)
          ? event : best, null);
    }

    function rebuildAudit() {
      audit.innerHTML = "";
      document.querySelectorAll("g.note.audit-correct, g.note.audit-missed, g.note.audit-early")
        .forEach(node => {
          node.classList.remove("audit-correct", "audit-missed", "audit-early");
          paintNotehead(node);
        });
      if (!auditVisible) return;
      for (const entry of auditTrail) {
        const ms = entry.beat * 60000 / bpm;
        const event = eventAtBeat(entry.beat);
        if (pageForEvent(event) !== currentPage) continue;
        const atTime = toolkit?.getElementsAtTime(Math.max(0, Math.round(ms)));
        const exactNoteElement = (event?.on || [])
          .map(elementForVerovioId)
          .filter(Boolean)
          .find(element => midiFromElement(element) === Number(entry.midiNote));
        if (["extra", "wrong"].includes(entry.kind) && entry.midiNote != null) {
          const point = pitchPoint(event, entry.midiNote);
          if (point) {
            const mark = document.createElement("div");
            mark.className = "audit-pitch-note";
            mark.style.left = `${point.x}px`;
            mark.style.top = `${point.y}px`;
            mark.dataset.label = point.accidental;
            mark.title = `Extra or wrong note · ${midiName(entry.midiNote)}`;
            audit.appendChild(mark);
            continue;
          }
        }
        const noteElement = exactNoteElement || elementsForEvent(event, entry.midiNote)[0];
        if (noteElement && ["correct", "missed", "early"].includes(entry.kind)) {
          noteElement.classList.add(`audit-${entry.kind}`);
          paintNotehead(noteElement, entry.kind === "correct" ? "#19f47b" :
            entry.kind === "missed" ? "#ff6577" : "#ffb54d");
          continue;
        }
        const noteRect = noteElement?.getBoundingClientRect();
        const x = noteRect ? noteRect.left + noteRect.width / 2 : eventViewportCenter(event);
        if (x == null) continue;
        const rect = noteElement?.getBoundingClientRect();
        const mark = document.createElement("div");
        mark.className = `audit-mark ${entry.kind}`;
        mark.style.left = `${x}px`;
        mark.style.top = `${Math.max(24, (rect?.top ?? innerHeight * .7) - 18)}px`;
        const span = document.createElement("span");
        span.textContent = entry.kind === "correct" ? "✓" :
          entry.kind === "missed" ? "M" :
          entry.kind === "early" ? "H" : "×";
        mark.title = `${entry.label}${entry.midiNote == null ? "" : ` · ${midiName(entry.midiNote)}`}`;
        mark.appendChild(span);
        audit.appendChild(mark);
      }
    }

    function startPlayback(offsetBeat = 0) {
      beginTimeline(offsetBeat);
    }

    function stopPlayback() {
      playing = false;
      cancelAnimationFrame(frameHandle);
      clearTemporaryLiveNoteFeedback();
      clearPracticeWrongNote(true);
    }

    function beginTimeline(startBeat = 0) {
      stopPlayback();
      timelineRunning = true;
      latestRequestedBeat = Math.max(0, Number(startBeat || 0));
      lastAuthoritativeBeat = latestRequestedBeat;
      runtimeTelemetry = createRuntimeTelemetry(latestRequestedBeat);
      window.__cadenzaRuntimeTelemetry = runtimeTelemetry;
      setCursorBeat(latestRequestedBeat, true);
    }

    function endTimeline() {
      timelineRunning = false;
      stopPlayback();
      if (runtimeTelemetry && !runtimeTelemetry.reported) {
        const finalQstamp = timemap.at(-1)?.qstamp ?? 0;
        runtimeTelemetry.finalQstamp = finalQstamp;
        runtimeTelemetry.completed = runtimeTelemetry.endBeat + .02 >= finalQstamp;
        runtimeTelemetry.layoutValidation = lastLayoutValidation;
        runtimeTelemetry.reported = true;
        window.__cadenzaRuntimeTelemetry = runtimeTelemetry;
        post("runtimeTelemetry", runtimeTelemetry);
      }
    }

    function setCursorBeat(beat, reset = false) {
      const requestedBeat = Math.max(0, Number(beat || 0));
      if (!reset && timelineRunning && requestedBeat + 0.0001 < lastAuthoritativeBeat) return;
      // The native session resets its visual cursor after a run. Freeze the
      // completed generation before accepting that explicit rewind so the
      // final 306-beat report is not mutated into a false backward sample.
      if (reset && timelineRunning && requestedBeat + 0.0001 < lastAuthoritativeBeat) {
        endTimeline();
      }
      if (reset && readingMode === "Continuous") resetContinuousViewport();
      latestRequestedBeat = requestedBeat;
      lastAuthoritativeBeat = requestedBeat;
      renderLatestCursor();
    }

    function renderLatestCursor() {
      const beat = latestRequestedBeat;
      const sourceBeat = performanceToSourceBeat(beat);
      const ms = sourceBeat * 60000 / bpm;
      const desiredPage = pageForEvent(eventAtBeat(beat));
      if (desiredPage !== currentPage) {
        if (!pendingPage || pendingPage !== desiredPage) {
          const direction = desiredPage > currentPage ? 1 : -1;
          renderPage(desiredPage, true, direction, renderLatestCursor);
        }
        return;
      }
      if (pendingPage) return;
      updateCursor(beat * 60000 / bpm, true);
      const atTime = toolkit?.getElementsAtTime(Math.max(0, Math.round(ms)));
      updateExpectedState(atTime, beat);
    }

    function restoreExpectedStateAfterRedraw() {
      if (!toolkit || !timemap.length) return;
      const beat = latestRequestedBeat;
      const sourceBeat = performanceToSourceBeat(beat);
      const ms = sourceBeat * 60000 / bpm;
      const atTime = toolkit.getElementsAtTime(Math.max(0, Math.round(ms)));
      updateExpectedState(atTime, beat);
    }

    function updateExpectedState(atTime, beat) {
      document.querySelectorAll(".expected").forEach(node => node.classList.remove("expected"));
      document.querySelectorAll(".active-measure-glow").forEach(node => node.classList.remove("active-measure-glow"));
      document.querySelectorAll(".hint-svg-badge").forEach(node => node.remove());
      for (const id of atTime?.notes || []) {
        const el = elementForVerovioId(id);
        if (el) {
          el.classList.add("expected");
          el.querySelectorAll(".syl, text, tspan").forEach(c => c.classList.add("expected"));
        }
      }
      for (const id of atTime?.elements || []) {
        const el = elementForVerovioId(id);
        if (el && (el.matches(".syl") || el.closest(".syl"))) {
          el.classList.add("expected");
        }
      }
      updateHintLane(atTime, beat);
    }

    function attachSvgHintBadge(noteEl, noteText) {
      if (!noteEl || !noteText) return;
      noteEl.querySelector(".hint-svg-badge")?.remove();
      try {
        const notehead = noteEl.querySelector(".notehead") || noteEl;
        const headRect = notehead.getBoundingClientRect();
        const measure = noteEl.closest("g.measure");
        const measureRect = measure?.getBoundingClientRect();
        const svg = noteEl.ownerSVGElement;
        const badgeLayer = measure || svg;
        const screenMatrix = badgeLayer?.getScreenCTM?.() || noteEl.getScreenCTM();
        if (!svg || !screenMatrix || headRect.width <= 0 || headRect.height <= 0) return;

        const inverse = screenMatrix.inverse();
        const toLocal = (screenX, screenY) => {
          const point = svg.createSVGPoint();
          point.x = screenX;
          point.y = screenY;
          return point.matrixTransform(inverse);
        };
        const widthPixels = Math.max(34, noteText.length * 8 + 12);
        const heightPixels = 22;
        const gapPixels = 7;
        const fitsRight = !measureRect ||
          headRect.right + gapPixels + widthPixels <= measureRect.right - 2;
        const leftPixels = fitsRight
          ? headRect.right + gapPixels
          : headRect.left - gapPixels - widthPixels;
        const centerYPixels = headRect.top + headRect.height / 2;
        const topLeft = toLocal(leftPixels, centerYPixels - heightPixels / 2);
        const bottomRight = toLocal(leftPixels + widthPixels, centerYPixels + heightPixels / 2);
        const center = toLocal(leftPixels + widthPixels / 2, centerYPixels);
        const textBaseline = toLocal(leftPixels + widthPixels / 2, centerYPixels + 4.2);
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("class", "hint-svg-badge");
        g.setAttribute("data-side", fitsRight ? "right" : "left");

        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("x", Math.min(topLeft.x, bottomRight.x));
        rect.setAttribute("y", Math.min(topLeft.y, bottomRight.y));
        rect.setAttribute("width", Math.abs(bottomRight.x - topLeft.x));
        rect.setAttribute("height", Math.abs(bottomRight.y - topLeft.y));
        rect.setAttribute("rx", Math.abs(toLocal(leftPixels + 5, centerYPixels).x - toLocal(leftPixels, centerYPixels).x));
        rect.setAttribute("ry", Math.abs(toLocal(leftPixels, centerYPixels + 5).y - toLocal(leftPixels, centerYPixels).y));
        rect.setAttribute("stroke-width", Math.abs(toLocal(leftPixels + 1, centerYPixels).x - toLocal(leftPixels, centerYPixels).x));

        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", center.x);
        text.setAttribute("y", textBaseline.y);
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("dominant-baseline", "alphabetic");
        text.setAttribute("font-family", "Segoe UI, sans-serif");
        text.setAttribute("font-size", Math.abs(toLocal(leftPixels, centerYPixels + 12).y - toLocal(leftPixels, centerYPixels).y));
        text.setAttribute("font-weight", "800");
        text.textContent = noteText;

        g.appendChild(rect);
        g.appendChild(text);
        // Append after Verovio's measure content so notation cannot paint over the guide.
        badgeLayer.appendChild(g);
      } catch (e) {}
    }

    function attachSvgChordHintBadge(entries) {
      const notes = entries
        .filter(entry => entry?.element && entry?.text)
        .map(entry => ({
          ...entry,
          headRect: (entry.element.querySelector(".notehead") || entry.element).getBoundingClientRect()
        }))
        .filter(entry => entry.headRect.width > 0 && entry.headRect.height > 0)
        .sort((left, right) => left.headRect.top - right.headRect.top);
      if (notes.length < 2) {
        if (notes[0]) attachSvgHintBadge(notes[0].element, notes[0].text);
        return;
      }

      try {
        const anchor = notes[0].element;
        const svg = anchor.ownerSVGElement;
        const measure = anchor.closest("g.measure");
        const badgeLayer = measure || svg;
        const screenMatrix = badgeLayer?.getScreenCTM?.() || anchor.getScreenCTM();
        if (!svg || !screenMatrix) return;
        const inverse = screenMatrix.inverse();
        const toLocal = (screenX, screenY) => {
          const point = svg.createSVGPoint();
          point.x = screenX;
          point.y = screenY;
          return point.matrixTransform(inverse);
        };

        const widthPixels = Math.max(38, ...notes.map(note => note.text.length * 8 + 14));
        const rowHeightPixels = 19;
        const paddingPixels = 4;
        const heightPixels = notes.length * rowHeightPixels + paddingPixels * 2;
        const gapPixels = 9;
        const headsLeft = Math.min(...notes.map(note => note.headRect.left));
        const headsRight = Math.max(...notes.map(note => note.headRect.right));
        const headsTop = Math.min(...notes.map(note => note.headRect.top));
        const headsBottom = Math.max(...notes.map(note => note.headRect.bottom));
        const measureRect = measure?.getBoundingClientRect();
        const fitsRight = !measureRect || headsRight + gapPixels + widthPixels <= measureRect.right - 2;
        const leftPixels = fitsRight
          ? headsRight + gapPixels
          : headsLeft - gapPixels - widthPixels;
        const centerYPixels = (headsTop + headsBottom) / 2;
        const topPixels = centerYPixels - heightPixels / 2;
        const topLeft = toLocal(leftPixels, topPixels);
        const bottomRight = toLocal(leftPixels + widthPixels, topPixels + heightPixels);

        const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
        group.setAttribute("class", "hint-svg-badge hint-chord-badge");
        group.setAttribute("data-side", fitsRight ? "right" : "left");

        const background = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        background.setAttribute("x", Math.min(topLeft.x, bottomRight.x));
        background.setAttribute("y", Math.min(topLeft.y, bottomRight.y));
        background.setAttribute("width", Math.abs(bottomRight.x - topLeft.x));
        background.setAttribute("height", Math.abs(bottomRight.y - topLeft.y));
        background.setAttribute("rx", Math.abs(toLocal(leftPixels + 5, topPixels).x - toLocal(leftPixels, topPixels).x));
        background.setAttribute("ry", Math.abs(toLocal(leftPixels, topPixels + 5).y - toLocal(leftPixels, topPixels).y));
        background.setAttribute("stroke-width", Math.abs(toLocal(leftPixels + 1, topPixels).x - toLocal(leftPixels, topPixels).x));
        group.appendChild(background);

        notes.forEach((note, index) => {
          const rowCenterPixels = topPixels + paddingPixels + rowHeightPixels * (index + .5);
          const headCenterPixels = note.headRect.top + note.headRect.height / 2;
          const lineStartPixels = fitsRight ? note.headRect.right : note.headRect.left;
          const lineEndPixels = fitsRight ? leftPixels : leftPixels + widthPixels;
          const lineStart = toLocal(lineStartPixels, headCenterPixels);
          const lineEnd = toLocal(lineEndPixels, rowCenterPixels);
          const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
          line.setAttribute("x1", lineStart.x);
          line.setAttribute("y1", lineStart.y);
          line.setAttribute("x2", lineEnd.x);
          line.setAttribute("y2", lineEnd.y);
          line.setAttribute("stroke-width", Math.abs(toLocal(lineStartPixels + 1.25, headCenterPixels).x - lineStart.x));
          group.appendChild(line);

          const labelPoint = toLocal(leftPixels + widthPixels / 2, rowCenterPixels + 4.2);
          const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
          text.setAttribute("x", labelPoint.x);
          text.setAttribute("y", labelPoint.y);
          text.setAttribute("text-anchor", "middle");
          text.setAttribute("dominant-baseline", "alphabetic");
          text.setAttribute("font-family", "Segoe UI, sans-serif");
          text.setAttribute("font-size", Math.abs(toLocal(leftPixels, rowCenterPixels + 12).y - toLocal(leftPixels, rowCenterPixels).y));
          text.setAttribute("font-weight", "800");
          text.textContent = note.text;
          group.appendChild(text);
        });

        // Keep the complete chord guide above every note, stem, flag, and beam in the measure.
        badgeLayer.appendChild(group);
      } catch (e) {}
    }

    function updateHintLane(atTime, beat) {
      if (!hintMode) return;
      const ids = atTime?.notes?.length ? atTime.notes : (eventAtBeat(beat)?.on || []);
      const entries = [];
      const seen = new Set();
      ids.forEach(id => {
        const sourceElement = elementForVerovioId(id);
        const element = sourceElement?.closest?.("g.note") || sourceElement;
        if (!element?.matches?.("g.note") || seen.has(element)) return;
        seen.add(element);
        const staff = element.closest("g.staff");
        if (handMode === "RightHand" && staff?.classList.contains("cadenza-bass")) return;
        if (handMode === "LeftHand" && staff?.classList.contains("cadenza-treble")) return;
        const measure = element.closest("g.measure");
        if (measure) measure.classList.add("active-measure-glow");

        const pitchStr = hintPitchName(element);
        if (pitchStr) entries.push({ element, text: pitchStr });
      });
      if (entries.length === 1) attachSvgHintBadge(entries[0].element, entries[0].text);
      else if (entries.length > 1) attachSvgChordHintBadge(entries);
    }

    function playbackFrame(now) {
      if (!playing) return;
      updateCursor(playbackOffsetMs + now - playbackStart, false);
      frameHandle = requestAnimationFrame(playbackFrame);
    }

    function eventWithNotesAtOrBefore(ms) {
      let result = null;
      for (const event of timemap) {
        if (event.tstamp > ms) break;
        if (event.on?.length) result = event;
      }
      return result;
    }

    function eventWithNotesAfter(ms) {
      return timemap.find(event => event.tstamp > ms && event.on?.length) || null;
    }

    function positionIds(event) {
      if (!event) return [];
      // A measure-on ID identifies the bar's left boundary, not the sounding
      // onset. Averaging it with note IDs made Continuous scroll/playhead lag
      // behind Verovio's correctly timed note and lyric highlight.
      if (event.on?.length) return [...event.on];
      if (event.restsOn?.length) return [...event.restsOn];
      return event.measureOn ? [event.measureOn] : [];
    }

    function eventWithPositionAtOrBefore(ms) {
      let result = null;
      for (const event of timemap) {
        if (event.tstamp > ms) break;
        if (positionIds(event).length) result = event;
      }
      return result;
    }

    function eventWithPositionAfter(ms) {
      const positioned = timemap.find(event => event.tstamp > ms && positionIds(event).length);
      if (positioned) return positioned;
      const finalEvent = timemap.at(-1);
      return finalEvent ? { ...finalEvent, cadenzaEnd: true } : null;
    }

    function eventViewportCenter(event) {
      const stageRect = stage.getBoundingClientRect();
      if (event?.cadenzaEnd) {
        const system = [...notation.querySelectorAll("g.system")].at(-1);
        return system ? systemEndBarLineX(system) : null;
      }
      const ids = positionIds(event);
      if (ids.length) {
        const centers = ids.map(elementForVerovioId)
          .filter(Boolean)
          .map(element => {
            const anchor = element.matches("g.note")
              ? (element.querySelector(":scope > g.notehead") || element.querySelector("g.notehead") || element)
              : element;
            const rect = anchor.getBoundingClientRect();
            const val = element.matches("g.measure") ? rect.left : rect.left + rect.width / 2;
            return val - stageRect.left;
          });
        if (centers.length) {
          return centers.reduce((sum, value) => sum + value, 0) / centers.length;
        }
      }

      if (event?.measureOn) {
        const measureEl = elementForVerovioId(event.measureOn) || notation.querySelector("g.measure");
        if (measureEl) {
          const rect = measureEl.getBoundingClientRect();
          return rect.left - stageRect.left;
        }
      }
      const firstNoteOrHead = notation.querySelector("g.note, .notehead, g.measure");
      if (firstNoteOrHead) {
        const rect = firstNoteOrHead.getBoundingClientRect();
        return (rect.left + rect.width / 2) - stageRect.left;
      }
      return 200;
    }

    function elementScoreX(element, useLeftEdge = false) {
      const svg = notation.querySelector("svg");
      if (!svg || !element || typeof element.getBBox !== "function" || typeof element.getCTM !== "function") return null;
      try {
        // Do not use the complete note group's bounds here. Verovio nests ties,
        // slurs, lyrics, flags, and accidentals beneath that group; a curved
        // span can move the group's center far beyond the actual onset and make
        // a continuous playhead over-scroll, disappear, and then appear to run
        // backward. The notehead is the authoritative horizontal onset anchor.
        const anchor = element.matches("g.note")
          ? (element.querySelector(":scope > g.notehead") || element.querySelector("g.notehead") || element)
          : element;
        const box = anchor.getBBox();
        const matrix = anchor.getCTM();
        if (!matrix) return null;
        const point = svg.createSVGPoint();
        point.x = useLeftEdge ? box.x : box.x + box.width / 2;
        point.y = box.y + box.height / 2;
        return point.matrixTransform(matrix).x;
      } catch {
        return null;
      }
    }

    function eventScoreCenter(event) {
      if (!event) return null;
      if (event?.cadenzaEnd) {
        if (continuousEndX != null) return continuousEndX;
        const system = [...notation.querySelectorAll("g.system")].at(-1);
        if (!system) return null;
        const center = elementScoreX(system);
        const box = system.getBBox();
        const matrix = system.getCTM();
        if (center == null || !matrix) return null;
        const svg = notation.querySelector("svg");
        const point = svg.createSVGPoint();
        point.x = box.x + box.width;
        point.y = box.y + box.height / 2;
        continuousEndX = point.matrixTransform(matrix).x;
        return continuousEndX;
      }
      if (continuousCoordinateCache.has(event)) return continuousCoordinateCache.get(event);
      const values = positionIds(event)
        .map(elementForVerovioId)
        .filter(Boolean)
        .map(element => elementScoreX(element, element.matches("g.measure")))
        .filter(Number.isFinite);
      const result = values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : null;
      continuousCoordinateCache.set(event, result);
      return result;
    }

    function createRuntimeTelemetry(startBeat) {
      return {
        generation: ++runtimeTelemetryGeneration,
        mode: readingMode,
        startBeat,
        endBeat: startBeat,
        samples: 0,
        eventCheckpoints: [],
        lastEventKey: "",
        lastBeat: startBeat,
        lastOffsetX: continuousOffsetX,
        backwardBeatCount: 0,
        backwardOffsetCount: 0,
        clippedPlayheadCount: 0,
        clippedSystemCount: 0,
        futureVisibilityShortfallCount: 0,
        minFutureVisibleWidth: Number.POSITIVE_INFINITY,
        maxCenterError: 0,
        maxPlayheadAnchorError: 0,
        maxHighlightedPlayheadError: 0,
        reported: false
      };
    }

    function recordRuntimeTelemetry(beat, previous, next, scoreX, visibleX, highlightedX) {
      if (!runtimeTelemetry || runtimeTelemetry.reported || readingMode !== "Continuous") return;
      const stageRect = stage.getBoundingClientRect();
      const system = systemForEvent(previous || next);
      const systemRect = system?.getBoundingClientRect();
      const centerError = systemRect
        ? Math.abs((systemRect.top + systemRect.bottom) / 2 - (stageRect.top + stageRect.height / 2))
        : 0;
      const anchorX = Math.max(180, stageRect.width * .32);
      const hasReachedAnchor = scoreX * userZoom + 24 >= anchorX;
      runtimeTelemetry.samples++;
      runtimeTelemetry.endBeat = beat;
      if (beat + .0001 < runtimeTelemetry.lastBeat) runtimeTelemetry.backwardBeatCount++;
      if (timelineRunning && continuousOffsetX > runtimeTelemetry.lastOffsetX + .25) runtimeTelemetry.backwardOffsetCount++;
      if (visibleX < -1 || visibleX > stageRect.width + 1) runtimeTelemetry.clippedPlayheadCount++;
      if (systemRect && (systemRect.bottom < stageRect.top || systemRect.top > stageRect.bottom)) {
        runtimeTelemetry.clippedSystemCount++;
      }
      const finalQstamp = timemap.at(-1)?.qstamp ?? beat;
      if (systemRect && beat + 4 < finalQstamp) {
        const futureVisibleWidth = systemRect.right - (stageRect.left + visibleX);
        runtimeTelemetry.minFutureVisibleWidth = Math.min(runtimeTelemetry.minFutureVisibleWidth, futureVisibleWidth);
        if (futureVisibleWidth < Math.min(280, stageRect.width * .2)) {
          runtimeTelemetry.futureVisibilityShortfallCount++;
        }
      }
      runtimeTelemetry.maxCenterError = Math.max(runtimeTelemetry.maxCenterError, centerError);
      if (hasReachedAnchor) {
        runtimeTelemetry.maxPlayheadAnchorError = Math.max(
          runtimeTelemetry.maxPlayheadAnchorError,
          Math.abs(visibleX - anchorX));
      }
      if (Number.isFinite(highlightedX)) {
        runtimeTelemetry.maxHighlightedPlayheadError = Math.max(
          runtimeTelemetry.maxHighlightedPlayheadError,
          Math.abs(visibleX - highlightedX));
      }
      const eventKey = `${previous?.qstamp ?? "start"}:${next?.qstamp ?? "end"}`;
      if (eventKey !== runtimeTelemetry.lastEventKey && runtimeTelemetry.eventCheckpoints.length < 900) {
        runtimeTelemetry.lastEventKey = eventKey;
        runtimeTelemetry.eventCheckpoints.push({
          beat,
          previousQstamp: previous?.qstamp ?? null,
          nextQstamp: next?.qstamp ?? null,
          scoreX,
          offsetX: continuousOffsetX,
          visibleX,
          highlightedX: Number.isFinite(highlightedX) ? highlightedX : null,
          highlightedPlayheadError: Number.isFinite(highlightedX) ? Math.abs(visibleX - highlightedX) : null,
          stageWidth: stageRect.width,
          centerError,
          repeatOccurrence: positionIds(previous).some(id => String(id).includes("-rend"))
        });
      }
      runtimeTelemetry.lastBeat = beat;
      runtimeTelemetry.lastOffsetX = continuousOffsetX;
    }

    function validateRendererLayout() {
      if (!timemap.length) return null;
      const continuous = readingMode === "Continuous";
      const positioned = continuous ? timemap.filter(event => positionIds(event).length) : [];
      let priorX = -Infinity;
      let backwardCoordinates = 0;
      let unresolvedCoordinates = 0;
      let repeatEvents = 0;
      const backwardSamples = [];
      for (const event of positioned) {
        const x = eventScoreCenter(event);
        if (!Number.isFinite(x)) {
          unresolvedCoordinates++;
          continue;
        }
        if (x + .5 < priorX) {
          backwardCoordinates++;
          if (backwardSamples.length < 8) backwardSamples.push({ qstamp: event.qstamp, priorX, x });
        }
        if (positionIds(event).some(id => String(id).includes("-rend"))) repeatEvents++;
        priorX = Math.max(priorX, x);
      }
      const bounds = renderedContentBounds();
      const stageRect = stage.getBoundingClientRect();
      const centerError = bounds
        ? Math.abs((bounds.top + bounds.bottom) / 2 - (stageRect.top + stageRect.height / 2))
        : null;
      lastLayoutValidation = {
        mode: readingMode,
        totalEvents: timemap.length,
        positionedEvents: positioned.length,
        repeatEvents,
        backwardCoordinates,
        unresolvedCoordinates,
        finalQstamp: timemap.at(-1)?.qstamp ?? null,
        centerError,
        topGap: bounds ? bounds.top - stageRect.top : null,
        bottomGap: bounds ? stageRect.bottom - bounds.bottom : null,
        gapDifference: bounds
          ? Math.abs((bounds.top - stageRect.top) - (stageRect.bottom - bounds.bottom))
          : null,
        stageWidth: stageRect.width,
        stageHeight: stageRect.height,
        backwardSamples
      };
      window.__cadenzaLayoutValidation = lastLayoutValidation;
      post("layoutValidation", lastLayoutValidation);
      return lastLayoutValidation;
    }

    function systemForEvent(event) {
      if (event?.cadenzaEnd) return [...notation.querySelectorAll("g.system")].at(-1) || null;
      return positionIds(event).map(elementForVerovioId).find(Boolean)?.closest("g.system") || null;
    }

    function elementForVerovioId(id) {
      if (!id) return null;
      const strId = String(id);
      let found = document.getElementById(strId) ||
        notation.querySelector(`[data-id="${CSS.escape(strId)}"]`);
      if (found) return found;
      if (strId.includes("rest")) {
        return notation.querySelector("g.rest") || notation.querySelector(".rest");
      }
      if (strId.includes("measure")) {
        return notation.querySelector("g.measure") || notation.querySelector(".measure");
      }
      return null;
    }

    function systemEndBarLineX(system) {
      if (!system) return null;
      const barlines = [...system.querySelectorAll("g.barLine, .barLine, path[class*='barLine']")];
      if (barlines.length > 0) {
        const lastBar = barlines[barlines.length - 1];
        const rect = lastBar.getBoundingClientRect();
        const stageRect = stage.getBoundingClientRect();
        return rect.left + rect.width / 2 - stageRect.left;
      }
      const systemRect = system.getBoundingClientRect();
      const stageRect = stage.getBoundingClientRect();
      return systemRect.right - 12 - stageRect.left;
    }

    function updateCursor(ms, immediate) {
      if (!toolkit || !timemap.length) return;
      const perfBeat = ms * bpm / 60000;
      const sourceBeat = performanceToSourceBeat(perfBeat);
      const sourceMs = sourceBeat * 60000 / bpm;
      const atTime = toolkit.getElementsAtTime(Math.max(0, Math.round(sourceMs)));
      const previous = eventWithPositionAtOrBefore(sourceMs);
      const next = eventWithPositionAfter(sourceMs);
      const desiredPage = pageForEvent(previous || next);
      if (desiredPage !== currentPage) {
        return;
      }

      const continuous = readingMode === "Continuous";
      const previousSystem = systemForEvent(previous);
      const nextSystem = systemForEvent(next);
      const nextCenter = eventViewportCenter(next);

      // If next is in a different system, on a different page, or has no rendered DOM element on this page:
      const crossesBoundary = Boolean(!nextSystem || nextCenter == null || (previousSystem && previousSystem !== nextSystem));

      let x1 = eventViewportCenter(previous);
      let x2 = (crossesBoundary && previousSystem) ? systemEndBarLineX(previousSystem) : nextCenter;
      if (x1 == null && x2 == null) return;
      if (x1 == null) x1 = x2;
      if (x2 == null) x2 = x1;
      const span = Math.max(1, (next?.tstamp ?? sourceMs) - (previous?.tstamp ?? sourceMs));
      const progress = Math.max(0, Math.min(1, (sourceMs - (previous?.tstamp ?? sourceMs)) / span));
      let x = x1 + (x2 - x1) * progress;

      let visibleX = x;
      if (continuous) {
        const stageRect = stage.getBoundingClientRect();
        const anchorX = Math.max(180, stageRect.width * .32);
        const targetOffsetX = continuousOffsetX + (anchorX - x);

        // Detect repeat bar sequence or rewind jump (x jumped backward or targetOffsetX is higher than current offset)
        if (targetOffsetX > continuousOffsetX + 150 || (window.lastPlayheadX != null && x < window.lastPlayheadX - 150)) {
          continuousOffsetX = targetOffsetX;
        } else if (timelineRunning) {
          continuousOffsetX = Math.min(continuousOffsetX, targetOffsetX);
        } else {
          continuousOffsetX = targetOffsetX;
        }
        window.lastPlayheadX = x;

        applyContinuousTransform();

        // Re-read exact DOM screen positions post-transform to guarantee 100% pixel perfection with notehead glow
        const pX = eventViewportCenter(previous);
        const nX = (crossesBoundary && previousSystem) ? systemEndBarLineX(previousSystem) : eventViewportCenter(next);
        if (pX != null && nX != null) {
          visibleX = pX + (nX - pX) * progress;
        }
      }

      playhead.style.left = `${visibleX}px`;
      playhead.style.opacity = "1";
      const system = previousSystem || nextSystem;
      if (system) {
        const stageRect = stage.getBoundingClientRect();
        const staves = [...system.querySelectorAll("g.staff")];
        let top, bottom;
        if (staves.length > 0) {
          const firstRect = staves[0].getBoundingClientRect();
          const lastRect = staves[staves.length - 1].getBoundingClientRect();

          // Extend playhead above tempo marks (e.g. quarter_note = 72) and chord symbols
          let extraTopSpace = 44;
          const topMarking = system.querySelector("g.tempo, g.harm, g.dynam, g.dir");
          if (topMarking) {
            const markRect = topMarking.getBoundingClientRect();
            const markTopOffset = firstRect.top - markRect.top;
            if (markTopOffset > 0) {
              extraTopSpace = Math.max(extraTopSpace, markTopOffset + 14);
            }
          }

          top = Math.max(6, firstRect.top - stageRect.top - extraTopSpace);
          bottom = Math.min(stageRect.height - 6, lastRect.bottom - stageRect.top + 16);
        } else {
          const systemRect = system.getBoundingClientRect();
          top = Math.max(6, systemRect.top - stageRect.top - 36);
          bottom = Math.min(stageRect.height - 6, systemRect.bottom - stageRect.top + 12);
        }
        playhead.style.top = `${top}px`;
        playhead.style.height = `${Math.max(24, bottom - top)}px`;
        const systems = [...notation.querySelectorAll("g.system")];
        const systemNumber = Math.max(1, systems.indexOf(system) + 1);
        const positionKey = `${currentPage}:${systemNumber}:${systems.length}`;
        if (positionKey !== lastPositionKey) {
          lastPositionKey = positionKey;
          post("position", { page: currentPage, pages: pageCount, system: systemNumber, systems: systems.length });
        }
      }

      document.querySelectorAll(".playing").forEach(node => node.classList.remove("playing"));
      const activeNoteIds = new Set([
        ...(previous?.on || []),
        ...(atTime?.notes || [])
      ]);
      activeNoteIds.forEach(id => {
        const el = elementForVerovioId(id);
        if (el) {
          el.classList.add("playing");
          el.querySelectorAll(".syl, text, tspan").forEach(c => c.classList.add("playing"));
        }
      });
      for (const id of atTime?.elements || []) {
        const el = elementForVerovioId(id);
        if (el && (el.matches(".syl") || el.closest(".syl"))) {
          el.classList.add("playing");
        }
      }
    }

    new ResizeObserver(() => {
      if (!toolkit || !notation.querySelector("svg")) return;
      if (readingMode === "Continuous") sizeContinuousSvg();
      alignNotationVertically();
      if (timemap.length) {
        renderLatestCursor();
        validateRendererLayout();
      }
    }).observe(stage);

    function findTiedContinuationElements(node) {
      if (!node || !notation) return [];
      const note = node.closest?.("g.note") || node;
      const noteId = note.id || note.getAttribute("data-id");
      if (!noteId) return [];

      const result = [];
      const visited = new Set([noteId]);
      const queue = [noteId];

      while (queue.length > 0) {
        const currentId = queue.shift();
        const ties = notation.querySelectorAll("g.tie, .tie, g.slur, .slur");
        for (const item of ties) {
          const itemId = item.id || item.getAttribute("data-id");
          let startId = item.getAttribute("data-startid") || item.getAttribute("startid") ||
            item.querySelector("[data-startid]")?.getAttribute("data-startid") ||
            item.querySelector("[startid]")?.getAttribute("startid") || "";
          let endId = item.getAttribute("data-endid") || item.getAttribute("endid") ||
            item.querySelector("[data-endid]")?.getAttribute("data-endid") ||
            item.querySelector("[endid]")?.getAttribute("endid") || "";

          if ((!startId || !endId) && toolkit?.getElementAttr && itemId) {
            try {
              const attrs = toolkit.getElementAttr(itemId);
              if (attrs) {
                startId = startId || attrs.startid || attrs["data-startid"] || attrs["@startid"] || "";
                endId = endId || attrs.endid || attrs["data-endid"] || attrs["@endid"] || "";
              }
            } catch {
              // ignore
            }
          }

          startId = String(startId || "").replace(/^#/, "");
          endId = String(endId || "").replace(/^#/, "");

          const matchStart = startId && (startId === currentId || currentId.endsWith(startId) || startId.endsWith(currentId));
          const matchEnd = endId && (endId === currentId || currentId.endsWith(endId) || endId.endsWith(currentId));

          if (matchStart && endId && !visited.has(endId)) {
            visited.add(endId);
            queue.push(endId);
            const targetNode = elementForVerovioId(endId);
            if (targetNode) {
              const targetNote = targetNode.closest?.("g.note") || targetNode;
              result.push(targetNote);
            }
          } else if (matchEnd && startId && !visited.has(startId)) {
            visited.add(startId);
            queue.push(startId);
            const sourceNode = elementForVerovioId(startId);
            if (sourceNode) {
              const sourceNote = sourceNode.closest?.("g.note") || sourceNode;
              result.push(sourceNote);
            }
          }
        }
      }
      return result;
    }

    function showFeedback(kind, beat, midiNote = null, dispatchId = 0, runGeneration = 0, eventId = 0, occurrenceIndex = 0, staffNumber = 0) {
      const numericRunGeneration = Number(runGeneration || 0);
      if (!lessonRunning || (numericRunGeneration > 0 && numericRunGeneration !== lessonGeneration)) return false;
      const numericDispatchId = Number(dispatchId || 0);
      feedbackTelemetry.received++;
      if (kind === "wrong" || kind === "extra") feedbackTelemetry.receivedWrong++;
      if (kind === "correct") feedbackTelemetry.receivedCorrect++;
      if (numericDispatchId > 0) {
        if (feedbackTelemetry.lastDispatchId > 0 && numericDispatchId > feedbackTelemetry.lastDispatchId + 1)
          feedbackTelemetry.dispatchGaps += numericDispatchId - feedbackTelemetry.lastDispatchId - 1;
        feedbackTelemetry.lastDispatchId = Math.max(feedbackTelemetry.lastDispatchId, numericDispatchId);
      }
      const ms = Number(beat || 0) * 60000 / bpm;
      if (lessonMode === "WaitForYou") setCursorBeat(beat);
      const event = eventAtBeat(beat);
      const targetElements = elementsForEvent(event, midiNote, staffNumber);

      if (lessonMode === "WaitForYou" && (kind === "wrong" || kind === "extra")) {
        activeWrongFeedback = {
          beat: Number(beat || 0),
          midiNote: Number(midiNote),
          dispatchId: numericDispatchId,
          eventId: Number(eventId || 0),
          occurrenceIndex: Number(occurrenceIndex || 0),
          kind,
          staffNumber: Number(staffNumber || 0),
          expiresAt: performance.now() + 900
        };
        showPracticeWrongNote(event, midiNote, numericDispatchId, false, staffNumber);
        return true;
      }
      if (lessonMode === "WaitForYou" && kind === "correct") {
        clearPracticeWrongNote();
        const acceptedTargets = targetElements.length ? targetElements : [null];
        const expandedTargets = [];
        for (const node of acceptedTargets) {
          if (node) {
            expandedTargets.push(node);
            for (const continuation of findTiedContinuationElements(node)) {
              if (!expandedTargets.includes(continuation)) expandedTargets.push(continuation);
            }
          }
        }
        const targetsToPaint = expandedTargets.length ? expandedTargets : acceptedTargets;
        const renderedKeys = [];
        const paintedTargets = targetsToPaint.map((node, targetIndex) => {
          const noteIdentity = node?.id || node?.getAttribute("data-id") ||
            `${Number(beat || 0).toFixed(6)}:${Number(midiNote)}:${Number(staffNumber || 0)}:${targetIndex}`;
          const persistentKey = `${lessonGeneration}:${Number(occurrenceIndex || 0)}:${noteIdentity}`;
          const item = {
            beat: Number(beat || 0),
            midiNote: midiNote == null ? null : Number(midiNote),
            eventId: Number(eventId || 0),
            occurrenceIndex: Number(occurrenceIndex || 0),
            staffNumber: Number(staffNumber || 0),
            noteIdentity
          };
          persistentCorrectFeedback.set(persistentKey, item);
          const rendered = renderPracticeCorrectNote(persistentKey, item);
          if (rendered) renderedKeys.push(persistentKey);
          const overlay = practiceWrongNote.querySelector(
            `:scope > g.correct-feedback[data-feedback-key="${CSS.escape(persistentKey)}"]`);
          const head = overlay?.querySelector(".correct-notehead");
          const rect = head?.getBoundingClientRect();
          const style = head ? getComputedStyle(head) : null;
          const stageRect = stage.getBoundingClientRect();
          const describePart = selector => {
            const part = node?.querySelector(selector);
            const partPaint = part?.querySelector("use, path, line, polygon, polyline") || part;
            const partStyle = partPaint ? getComputedStyle(partPaint) : null;
            return part ? {
              fill: partStyle?.fill || null,
              stroke: partStyle?.stroke || null
            } : null;
          };
          return {
            id: noteIdentity,
            overlayKey: persistentKey,
            overlayFound: Boolean(overlay),
            duplicateOverlayCount: practiceWrongNote.querySelectorAll(
              `:scope > g.correct-feedback[data-feedback-key="${CSS.escape(persistentKey)}"]`).length,
            headFound: Boolean(head),
            fill: style?.fill || null,
            stroke: style?.stroke || null,
            opacity: style?.opacity || null,
            x: rect ? rect.left + rect.width / 2 - stageRect.left : null,
            y: rect ? rect.top + rect.height / 2 - stageRect.top : null,
            width: rect?.width ?? null,
            height: rect?.height ?? null,
            nonHeadPaint: {
              stem: describePart(".stem"),
              flag: describePart(".flag"),
              accidental: describePart(".accid"),
              beam: describePart(".beam"),
              ledger: describePart(".ledgerLines")
            },
            visibleInStage: Boolean(rect &&
              rect.right >= stageRect.left && rect.left <= stageRect.right &&
              rect.bottom >= stageRect.top && rect.top <= stageRect.bottom)
          };
        });
        feedbackTelemetry.renderedCorrect += renderedKeys.length;
        post("feedbackAck", {
          runGeneration: lessonGeneration,
          eventId: Number(eventId || 0),
          dispatchId: numericDispatchId,
          occurrenceIndex: Number(occurrenceIndex || 0),
          kind,
          staffNumber: Number(staffNumber || 0),
          rendered: renderedKeys.length > 0,
          renderedCount: renderedKeys.length,
          persistentCorrectCount: persistentCorrectFeedback.size,
          paintedTargets
        });
        if (lessonRunning && lessonMode === "TimedPlay" && onlyShowFeedbackOnEnd) {
          return true;
        }
        return true;
      }

      if (lessonRunning && lessonMode === "TimedPlay" && onlyShowFeedbackOnEnd) {
        return;
      }

      if (kind === "release") {
        targetElements.forEach(node => node.classList.remove("feedback-hold", "feedback-early"));
        return;
      }

      if (kind === "hold") {
        targetElements.forEach(node => node.classList.add("feedback-hold"));
        return;
      }

      document.querySelectorAll("g.note.feedback-wrong, g.note.feedback-early, g.note.feedback-missed")
        .forEach(node => {
          node.classList.remove("feedback-wrong", "feedback-early", "feedback-missed");
          paintNotehead(node);
        });
      if (kind !== "correct") {
        document.querySelectorAll("g.note.feedback-early, g.note.feedback-missed")
          .forEach(node => node.classList.remove("feedback-early", "feedback-missed"));
      }

      const noteClass = kind === "correct" ? "feedback-correct" :
        kind === "wrong" || kind === "extra" ? "feedback-wrong" :
        kind === "hold" ? "feedback-hold" :
        kind === "early" ? "feedback-early" :
        kind === "missed" ? "feedback-missed" : "";
      if (noteClass) {
        const visualTargets = kind === "wrong" || kind === "extra"
          ? elementsForEvent(event, null).filter(node => !node.classList.contains("feedback-correct"))
          : targetElements;
        const noteColor = kind === "correct" ? "#19f47b" :
          kind === "wrong" || kind === "extra" || kind === "missed" ? "#ff6577" :
          kind === "early" ? "#ffb54d" : "#f6f2e9";
        const expandedTargets = [];
        visualTargets.forEach(node => {
          if (node) {
            expandedTargets.push(node);
            if (kind === "correct") {
              for (const continuation of findTiedContinuationElements(node)) {
                if (!expandedTargets.includes(continuation)) expandedTargets.push(continuation);
              }
            }
          }
        });
        expandedTargets.forEach(node => {
          node.classList.add(noteClass);
          if (kind !== "hold") paintNotehead(node, noteColor);
        });
      }

      if (lessonMode === "TimedPlay" && ["correct", "wrong", "extra", "missed", "early"].includes(kind)) {
        auditTrail.push({
          kind,
          beat: Number(beat || 0),
          midiNote: midiNote == null ? null : Number(midiNote),
          label: kind === "correct" ? "Correct note" :
            kind === "missed" ? "Missed expected note" :
            kind === "early" ? "Released early" : "Extra or wrong note"
        });
        if (auditVisible) rebuildAudit();
      }

      const labels = { correct: "✓", wrong: "×", extra: "×", missed: "MISS", hold: "HOLD", early: "EARLY" };
      feedback.textContent = labels[kind] || "•";
      feedback.className = "";
      feedback.style.opacity = "0";
      if (noteClass && noteClass !== "feedback-correct") {
        clearTimeout(feedbackTimer);
        feedbackTimer = setTimeout(() => {
          document.querySelectorAll(`g.note.${noteClass}`).forEach(node => {
            node.classList.remove(noteClass);
            paintNotehead(node);
          });
          reapplyLessonFeedback();
        }, kind === "wrong" || kind === "extra" ? 420 : 700);
      }
    }

    function clearPartialFeedback(occurrenceIndex) {
      const idx = Number(occurrenceIndex || 0);
      const keysToDelete = [];
      for (const [key, item] of persistentCorrectFeedback) {
        if (Number(item.occurrenceIndex || 0) === idx) {
          keysToDelete.push(key);
        }
      }
      for (const key of keysToDelete) {
        persistentCorrectFeedback.delete(key);
      }
      document.querySelectorAll("g.note.feedback-correct").forEach(node => {
        node.classList.remove("feedback-correct");
        paintNotehead(node);
      });
      reapplyLessonFeedback();
    }

    function showCountdownStep(text) {
      const overlay = document.getElementById("countdownOverlay");
      const number = document.getElementById("countdownNumber");
      if (!overlay || !number) return;
      overlay.classList.add("active");
      number.textContent = String(text || "");
      number.classList.remove("pulse");
      void number.offsetWidth;
      number.classList.add("pulse");
    }

    function hideCountdown() {
      const overlay = document.getElementById("countdownOverlay");
      const number = document.getElementById("countdownNumber");
      if (overlay) overlay.classList.remove("active");
      if (number) number.classList.remove("pulse");
    }

    function showResultsModal(headline, reward, accuracy, timing, hold, pedal, correctCount, missedCount, extraCount, repeatText, progress, voicing, articulation, chordSync) {
      const overlay = document.getElementById("resultsModalOverlay");
      if (!overlay) return;
      document.getElementById("resultsHeadline").textContent = headline || "Run Complete";
      document.getElementById("resultsReward").textContent = reward || "";
      document.getElementById("resAccuracy").textContent = accuracy || "0%";
      document.getElementById("resTiming").textContent = timing || "n/a";
      document.getElementById("resHold").textContent = hold || "—";
      document.getElementById("resVoicing").textContent = voicing || "100%";
      document.getElementById("resArticulation").textContent = articulation || "100%";
      document.getElementById("resChordSync").textContent = chordSync || "100%";

      const pedalBox = document.getElementById("resPedalBox");
      if (pedal !== null && pedal !== undefined) {
        document.getElementById("resPedal").textContent = pedal;
        if (pedalBox) pedalBox.style.display = "block";
      } else {
        if (pedalBox) pedalBox.style.display = "none";
      }

      document.getElementById("resCorrectCount").textContent = String(correctCount || 0);
      document.getElementById("resMissedCount").textContent = String(missedCount || 0);
      document.getElementById("resExtraCount").textContent = String(extraCount || 0);

      updateResultsAutoRepeat(repeatText, progress);
      overlay.classList.add("active");
    }

    function updateResultsAutoRepeat(text, progress) {
      const txt = document.getElementById("resultsRepeatText");
      const fill = document.getElementById("resultsProgressFill");
      if (txt) txt.textContent = text || "";
      const pct = Math.min(100, Math.max(0, Number(progress || 0) * 100));
      if (fill) fill.style.width = `${pct}%`;
    }

    function hideResultsModal() {
      const overlay = document.getElementById("resultsModalOverlay");
      if (overlay) overlay.classList.remove("active");
    }

    function clearTemporaryLiveNoteFeedback() {
      document.querySelectorAll("g.temp-live-correct, g.temp-live-wrong")
        .forEach(node => { if (node.parentNode) node.parentNode.removeChild(node); });
    }

    function renderLiveNoteOverlay(kind, event, midiNote, dispatchId) {
      const rawPoint = pitchPoint(event, Number(midiNote), 0);
      const point = overlayPointToScoreCoordinates(rawPoint);
      if (!point) return null;

      const svgNs = "http://www.w3.org/2000/svg";
      const group = document.createElementNS(svgNs, "g");
      group.setAttribute("class", kind === "correct" ? "correct-feedback" : "wrong-feedback");
      group.setAttribute("data-dispatch", dispatchId);
      group.setAttribute("data-midi", Number(midiNote));

      const color = kind === "correct" ? "#19f47b" : "#FF3B5C";
      const lineStep = (point.step || 4) * 2;
      const topBoundary = point.top ?? (point.y - 20);
      const bottomBoundary = point.bottom ?? (point.y + 20);

      if (point.y > bottomBoundary + (point.step || 4)) {
        for (let y = bottomBoundary + lineStep; y <= point.y + 1; y += lineStep) {
          const line = document.createElementNS(svgNs, "line");
          line.setAttribute("x1", point.x - 11);
          line.setAttribute("x2", point.x + 11);
          line.setAttribute("y1", y);
          line.setAttribute("y2", y);
          line.setAttribute("class", "wrong-ledger");
          line.setAttribute("stroke", color);
          line.setAttribute("stroke-width", "1.5");
          group.appendChild(line);
        }
      } else if (point.y < topBoundary - (point.step || 4)) {
        for (let y = topBoundary - lineStep; y >= point.y - 1; y -= lineStep) {
          const line = document.createElementNS(svgNs, "line");
          line.setAttribute("x1", point.x - 11);
          line.setAttribute("x2", point.x + 11);
          line.setAttribute("y1", y);
          line.setAttribute("y2", y);
          line.setAttribute("class", "wrong-ledger");
          line.setAttribute("stroke", color);
          line.setAttribute("stroke-width", "1.5");
          group.appendChild(line);
        }
      }

      appendFeedbackNotehead(
        group,
        feedbackSourceHead(event, point.staffKind, 0),
        point,
        kind === "correct" ? "correct-notehead" : "wrong-notehead",
        color);

      if (point.accidental) {
        const accidental = document.createElementNS(svgNs, "text");
        accidental.setAttribute("x", point.x - 23);
        accidental.setAttribute("y", point.y + 7);
        accidental.setAttribute("class", "wrong-accidental");
        accidental.setAttribute("fill", color);
        accidental.textContent = point.accidental;
        group.appendChild(accidental);
      }

      practiceWrongNote.appendChild(group);
      updatePracticeFeedbackOverlayVisibility();
      return group;
    }

    function showTemporaryLiveNoteFeedback(kind, beat, midiNote) {
      if (lessonRunning && lessonMode !== "Listen") return;
      const targetBeat = Number(beat != null ? beat : cursorBeat || 0);
      let event = eventAtBeat(targetBeat);
      if (!event && timemap.length > 0) event = timemap[0];

      const targetElements = elementsForEvent(event, Number(midiNote), 0);
      const paintedNodes = [];
      for (const el of targetElements) {
        if (el) {
          el.classList.add(kind === "correct" ? "feedback-correct" : "feedback-wrong");
          paintNotehead(el, kind === "correct" ? "#19f47b" : "#FF3B5C");
          paintedNodes.push(el);

          if (kind === "correct") {
            for (const continuation of findTiedContinuationElements(el)) {
              if (!paintedNodes.includes(continuation)) {
                continuation.classList.add("feedback-correct");
                paintNotehead(continuation, "#19f47b");
                paintedNodes.push(continuation);
              }
            }
          }
        }
      }

      const tempDispatchId = Math.floor(Math.random() * 1000000) + 900000;
      const overlayGroup = renderLiveNoteOverlay(kind, event, Number(midiNote), tempDispatchId);

      setTimeout(() => {
        for (const el of paintedNodes) {
          el.classList.remove("feedback-correct", "feedback-wrong");
          resetNoteheadStyle(el);
        }
        if (overlayGroup && overlayGroup.parentNode) {
          overlayGroup.parentNode.removeChild(overlayGroup);
        }
        updatePracticeFeedbackOverlayVisibility();
      }, 1200);
    }

    function showHoldProgress(actionText, timeText, progress) {
      const overlay = document.getElementById("holdOverlay");
      const actionEl = document.getElementById("holdActionText");
      const timeEl = document.getElementById("holdTimeText");
      const barEl = document.getElementById("holdProgressBar");
      if (!overlay || !actionEl || !timeEl || !barEl) return;

      actionEl.textContent = String(actionText || "");
      timeEl.textContent = String(timeText || "");
      const pct = Math.min(100, Math.max(0, Number(progress || 0) * 100));
      barEl.style.width = pct.toFixed(1) + "%";
      overlay.classList.add("active");
    }

    function hideHoldProgress() {
      const overlay = document.getElementById("holdOverlay");
      if (overlay) overlay.classList.remove("active");
    }

    window.CadenzaNotation = { loadScore, setPerformanceTimeline, setReadingMode, setHintMode, setHandMode, setScoreAppearance, startPlayback, stopPlayback, beginTimeline, endTimeline, setCursorBeat, setZoom, setTempo, changePage, resetAudit, beginLesson, finishLesson, showFeedback, showTemporaryLiveNoteFeedback, clearPartialFeedback, showCountdownStep, hideCountdown, showResultsModal, updateResultsAutoRepeat, hideResultsModal, showHoldProgress, hideHoldProgress, getState, elementsAtBeat, validateRendererLayout, validateFeedbackGeometry };

    document.addEventListener("DOMContentLoaded", () => {
      verovio.module.onRuntimeInitialized = () => {
        toolkit = new verovio.toolkit();
        post("ready", { version: toolkit.getVersion() });
      };
    });
  </script>
</body>
